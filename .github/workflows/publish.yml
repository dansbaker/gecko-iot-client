name: Publish to PyPI

on:
  release:
    types: [published]
    # Only run if the release is created from the develop branch
  push:
    branches: [develop]
    tags:
      - 'v*'

# Set permissions for the GITHUB_TOKEN
permissions:
  contents: read
  id-token: write  # Required for OIDC authentication with PyPI

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest
    # Only run on releases from develop branch or version tags
    if: (github.event_name == 'release' && github.event.release.target_commitish == 'develop') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: 'pip'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install build auto-changelog setuptools-scm

    - name: Fix git tag ordering for setuptools-scm
      run: |
        # Remove alpha tags that conflict with release tags on the same commit
        # This ensures setuptools-scm picks up the release tag instead of alpha tag
        current_commit=$(git rev-parse HEAD)
        release_tag=$(git tag --list --sort=-version:refname "v*" | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+$" | head -1)
        if [ -n "$release_tag" ]; then
          release_commit=$(git rev-list -n 1 "$release_tag")
          if [ "$current_commit" = "$release_commit" ]; then
            echo "Current commit $current_commit has release tag $release_tag"
            # Remove any alpha/beta tags on the same commit
            git tag --list | grep -E "v.*-(alpha|beta|rc|a[0-9]+)" | while read tag; do
              tag_commit=$(git rev-list -n 1 "$tag" 2>/dev/null || echo "")
              if [ "$tag_commit" = "$current_commit" ]; then
                echo "Removing conflicting tag: $tag"
                git tag -d "$tag" || true
              fi
            done
          fi
        fi
        # Verify the git describe result
        echo "Git describe result: $(git describe --tags)"

    - name: Generate changelog
      run: |
        auto-changelog --template compact --output CHANGELOG.md --unreleased

    - name: Copy README for package
      run: |
        cp README.md gecko_iot_client/
        cp CHANGELOG.md gecko_iot_client/

    - name: Build package
      run: |
        cd gecko_iot_client
        # Set environment variable to force setuptools-scm to use the correct version
        export SETUPTOOLS_SCM_PRETEND_VERSION=$(git describe --tags --match "v[0-9]*.[0-9]*.[0-9]*" | sed 's/^v//')
        echo "Using version: $SETUPTOOLS_SCM_PRETEND_VERSION"
        python -m build

    - name: Store the distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: gecko_iot_client/dist/

  test-build:
    name: Test the built package 🧪
    runs-on: ubuntu-latest
    needs: [build]
    if: (github.event_name == 'release' && github.event.release.target_commitish == 'develop') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Test installation from wheel
      run: |
        python -m pip install --upgrade pip
        # Install the built package
        python -m pip install dist/*.whl
        # Test basic import
        python -c "import gecko_iot_client; print('Package import successful')"

  publish-to-pypi:
    name: Publish to PyPI 🚀
    runs-on: ubuntu-latest
    needs: [build, test-build]
    # Only publish on actual releases from develop branch, not on every push to develop
    if: github.event_name == 'release' && github.event.release.target_commitish == 'develop'

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        packages-dir: dist/

  publish-to-testpypi:
    name: Publish to TestPyPI 🧪
    runs-on: ubuntu-latest
    needs: [build, test-build]
    # Publish to TestPyPI on version tags from develop branch (for testing)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_name != 'main'

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

    - name: Publish distribution 📦 to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.TEST_PYPI_API_TOKEN }}
        repository-url: https://test.pypi.org/legacy/
        packages-dir: dist/